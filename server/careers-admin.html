<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elegant Capitals - Careers Management</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: Arial, sans-serif; 
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #fff;
            padding: 20px;
        }
        .container { 
            max-width: 1200px; 
            margin: 0 auto;
        }
        h1 { 
            color: #f59e0b; 
            margin-bottom: 30px;
            text-align: center;
        }
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #444;
        }
        .tab {
            padding: 10px 20px;
            background: #2d2d2d;
            border: none;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab.active {
            background: #f59e0b;
            color: #000;
        }
        .tab-content {
            display: none;
            background: #2d2d2d;
            padding: 30px;
            border-radius: 8px;
        }
        .tab-content.active { display: block; }
        input, textarea, select {
            width: 100%;
            margin: 10px 0;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
        }
        button {
            background: #f59e0b;
            color: #000;
            padding: 12px 24px;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            margin: 10px 5px 10px 0;
        }
        button:hover { background: #d97706; }
        .result {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
        }
        .success { background: #065f46; }
        .error { background: #7f1d1d; }
        .job-list, .app-list {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }
        .job-card, .app-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
        }
        .job-card h3, .app-card h3 {
            color: #f59e0b;
            margin-bottom: 10px;
        }
        .job-card p, .app-card p {
            margin: 5px 0;
            color: #ccc;
        }
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin: 5px 5px 0 0;
        }
        .badge.active { background: #065f46; }
        .badge.inactive { background: #7f1d1d; }
        .badge.pending { background: #92400e; }
        .actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .actions button {
            padding: 8px 16px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Elegant Capitals - Careers Management</h1>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('add-job')">➕ Add Job</button>
            <button class="tab" onclick="showTab('view-jobs')">📋 View Jobs</button>
            <button class="tab" onclick="showTab('applications')">📨 Applications</button>
        </div>

        <!-- Add Job Tab -->
        <div id="add-job" class="tab-content active">
            <h2>Add New Job Posting</h2>
            <form id="jobForm">
                <input type="text" id="title" placeholder="Job Title (e.g., Senior Financial Analyst)" required>
                <textarea id="description" placeholder="Job Description" rows="6" required></textarea>
                <input type="text" id="location" placeholder="Location (e.g., Nugegoda, Sri Lanka)" required>
                <select id="type" required>
                    <option value="">Select Job Type</option>
                    <option value="Full-time">Full-time</option>
                    <option value="Part-time">Part-time</option>
                    <option value="Contract">Contract</option>
                    <option value="Internship">Internship</option>
                </select>
                <input type="text" id="salary" placeholder="Salary Range (e.g., LKR 100,000 - 150,000)">
                <button type="submit">Add Job</button>
            </form>
            <div id="add-result"></div>
        </div>

        <!-- View Jobs Tab -->
        <div id="view-jobs" class="tab-content">
            <h2>Active Job Postings</h2>
            <button onclick="loadJobs()">🔄 Refresh</button>
            <div id="jobs-list" class="job-list"></div>
        </div>

        <!-- Applications Tab -->
        <div id="applications" class="tab-content">
            <h2>Job Applications</h2>
            <button onclick="loadApplications()">🔄 Refresh</button>
            <button onclick="exportApplications()">📥 Export CSV</button>
            <div id="apps-list" class="app-list"></div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:5000/api';

        function showTab(tabId) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById(tabId).classList.add('active');

            if (tabId === 'view-jobs') loadJobs();
            if (tabId === 'applications') loadApplications();
        }

        // Add Job
        document.getElementById('jobForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const job = {
                title: document.getElementById('title').value,
                description: document.getElementById('description').value,
                location: document.getElementById('location').value,
                type: document.getElementById('type').value,
                salary: document.getElementById('salary').value || 'Competitive'
            };

            try {
                const response = await fetch(`${API_URL}/careers/add`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(job)
                });
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('add-result').innerHTML = 
                        `<div class="result success">✓ Job added successfully! ID: ${data.job.id}</div>`;
                    document.getElementById('jobForm').reset();
                } else {
                    throw new Error(data.message);
                }
            } catch (error) {
                document.getElementById('add-result').innerHTML = 
                    `<div class="result error">✗ Error: ${error.message}</div>`;
            }
        });

        // Load Jobs
        async function loadJobs() {
            try {
                const response = await fetch(`${API_URL}/careers`);
                const data = await response.json();
                
                if (data.success) {
                    const jobsList = document.getElementById('jobs-list');
                    if (data.jobs.length === 0) {
                        jobsList.innerHTML = '<p>No jobs posted yet.</p>';
                        return;
                    }

                    jobsList.innerHTML = data.jobs.map(job => `
                        <div class="job-card">
                            <h3>${job.title}</h3>
                            <span class="badge ${job.status}">${job.status.toUpperCase()}</span>
                            <span class="badge">${job.type}</span>
                            <p><strong>Location:</strong> ${job.location}</p>
                            <p><strong>Salary:</strong> ${job.salary}</p>
                            <p>${job.description}</p>
                            <p style="font-size: 12px; color: #888;">Posted: ${new Date(job.createdAt).toLocaleString()}</p>
                            <div class="actions">
                                <button onclick="updateJobStatus(${job.id}, '${job.status === 'active' ? 'inactive' : 'active'}')">
                                    ${job.status === 'active' ? '⏸️ Deactivate' : '▶️ Activate'}
                                </button>
                                <button onclick="deleteJob(${job.id})" style="background: #7f1d1d;">🗑️ Delete</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('jobs-list').innerHTML = 
                    `<div class="result error">Error loading jobs: ${error.message}</div>`;
            }
        }

        // Update Job Status
        async function updateJobStatus(id, status) {
            try {
                const response = await fetch(`${API_URL}/careers/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert(`Job ${status}d successfully!`);
                    loadJobs();
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Delete Job
        async function deleteJob(id) {
            if (!confirm('Are you sure you want to delete this job?')) return;
            
            try {
                const response = await fetch(`${API_URL}/careers/${id}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('Job deleted successfully!');
                    loadJobs();
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Load Applications
        async function loadApplications() {
            try {
                const response = await fetch(`${API_URL}/careers/applications`);
                const data = await response.json();
                
                if (data.success) {
                    const appsList = document.getElementById('apps-list');
                    if (data.applications.length === 0) {
                        appsList.innerHTML = '<p>No applications received yet.</p>';
                        return;
                    }

                    appsList.innerHTML = data.applications.map(app => `
                        <div class="app-card">
                            <h3>${app.name}</h3>
                            <span class="badge ${app.status}">${app.status.toUpperCase()}</span>
                            <p><strong>Position:</strong> ${app.jobTitle}</p>
                            <p><strong>Email:</strong> ${app.email}</p>
                            <p><strong>Phone:</strong> ${app.phone}</p>
                            <p><strong>Resume:</strong> ${app.resumeName || 'Not provided'}</p>
                            <p><strong>Cover Letter:</strong> ${app.coverLetter}</p>
                            <p style="font-size: 12px; color: #888;">Applied: ${new Date(app.appliedAt).toLocaleString()}</p>
                            <div class="actions">
                                <button onclick="updateAppStatus(${app.id}, 'reviewed')">✅ Mark Reviewed</button>
                                <button onclick="updateAppStatus(${app.id}, 'shortlisted')">⭐ Shortlist</button>
                                <button onclick="updateAppStatus(${app.id}, 'rejected')" style="background: #7f1d1d;">❌ Reject</button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                document.getElementById('apps-list').innerHTML = 
                    `<div class="result error">Error loading applications: ${error.message}</div>`;
            }
        }

        // Update Application Status
        async function updateAppStatus(id, status) {
            try {
                const response = await fetch(`${API_URL}/careers/applications/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status })
                });
                const data = await response.json();
                
                if (data.success) {
                    alert(`Application marked as ${status}!`);
                    loadApplications();
                }
            } catch (error) {
                alert(`Error: ${error.message}`);
            }
        }

        // Export Applications
        function exportApplications() {
            window.open(`${API_URL}/careers/applications/export`, '_blank');
        }

        // Load initial data
        loadJobs();
    </script>
</body>
</html>
